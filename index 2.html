<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملف التوجيه الطلابي</title>
<meta name="apple-mobile-web-app-title" content="ملف التوجيه">
<meta name="theme-color" content="#163D22">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#F6F0E6;--fg:#3B2A1C;--muted:#7D6A57;--green:#163D22;--gold:#E9B949}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
img{width:150px;height:150px;border-radius:34px;box-shadow:0 14px 34px rgba(22,61,34,.22)}
h1{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;font-weight:800;font-size:26px;margin:0;color:var(--green)}
p{margin:0;color:var(--muted);font-size:14px}
a.go{display:inline-block;background:var(--green);color:#FFF6E2;text-decoration:none;font-weight:600;font-size:17px;padding:14px 34px;border-radius:14px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:b 1s infinite alternate}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.25;transform:translateY(-4px)}}
.tip{max-width:340px;background:#fff;border:1px solid #E3D6C3;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.8;color:var(--fg)}
.tip b{color:var(--green)}
</style>
</head>
<body>
<img src="icon-512.png" alt="شعار الثانوية الثامنة والثلاثون">
<h1>ملف التوجيه الطلابي</h1>
<p>الثانوية الثامنة والثلاثون بالمدينة المنورة</p>
<a class="go" id="go" href="https://claude.ai/artifact/NZ5T53B9DM2pgKT1c8ZvrK">دخول المنصة</a>
<div class="dots" id="dots" hidden><i></i><i></i><i></i></div>
<p id="cd" hidden style="font-size:15px;color:var(--green);font-weight:600"></p>
<button id="stop" hidden style="border:1px solid #E3D6C3;background:#fff;border-radius:12px;padding:8px 18px;font:inherit;color:var(--fg)">إيقاف التحويل (لتثبيت الأيقونة)</button>
<div class="tip" id="tip" hidden><b>ثبّتي الملف كتطبيق:</b><br>آيفون: زر المشاركة ← «إضافة إلى الشاشة الرئيسية»<br>أندرويد: ⋮ ← «إضافة إلى الشاشة الرئيسية»</div>
<p style="font-size:12px">إعداد الموجهات الطلابيات: سارة السناني | سميرة السهلي</p>
<script>
var URL_APP=document.getElementById('go').href,n=3,t;
var cd=document.getElementById('cd'),stop=document.getElementById('stop'),tip=document.getElementById('tip');
cd.hidden=false;stop.hidden=false;
function tick(){if(n<=0){location.href=URL_APP;return}cd.textContent='فتح المنصة خلال '+n+'…';n--;t=setTimeout(tick,1000)}
tick();
stop.onclick=function(){clearTimeout(t);cd.hidden=true;stop.hidden=true;tip.hidden=false};
</script>
</body>
</html>
